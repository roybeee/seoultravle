<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STORY 8 Studio</title>
<style>
:root{--bg:#f7f6f3;--panel:#fff;--ink:#1d1d1f;--mute:#6b6b70;--line:#e3e1dc;--accent:#d6336c;--ok:#2f9e44;--warn:#e67700;--err:#c92a2a;--chip:#f1efe9}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--panel:#1d1d20;--ink:#ececee;--mute:#9a9aa2;--line:#2e2e33;--chip:#26262b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
header h1{font-size:16px;margin:0}header .sp{flex:1}
main{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media(max-width:860px){main{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px}.card h3{font-size:13px;margin:12px 0 6px}
button{border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:6px 10px;border-radius:7px;cursor:pointer;font:inherit}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:wait}
input,select,textarea{width:100%;padding:7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>button{flex:0 0 auto}
.muted{color:var(--mute);font-size:12px}.pill{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--chip);font-size:12px}
.pill.auto{background:#e7f5ff;color:#1864ab}.pill.collab{background:#fff0f6;color:#a61e4d}
.proj{padding:8px;border-radius:7px;cursor:pointer}.proj:hover,.proj.on{background:var(--chip)}
.tog{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);gap:8px}
.lock{color:var(--mute)}.issue.error,.issue.block{color:var(--err)}.issue.warning{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:left}
.script{white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:7px;max-height:420px;overflow:auto;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
#toast{position:fixed;bottom:16px;right:16px;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;display:none;white-space:pre-wrap}
</style>
</head>
<body>
<header><h1>STORY 8 Studio</h1><span class="muted">AI 하이브리드 숏드라마 스튜디오</span><span class="sp"></span>
<span id="health" class="pill">연결 확인 중</span>
<input id="user" style="width:160px" placeholder="작가 id"></header>
<main>
<aside>
  <div class="card"><h2>새 프로젝트</h2>
    <input id="pname" placeholder="작품 이름"><div style="height:6px"></div>
    <select id="pmode"><option value="collab">협업 모드 — 단계별 사람 결정·승인</option><option value="auto">자동 모드 — 사람 개입 없이 생성</option></select>
    <div style="height:6px"></div><input id="pbrand" placeholder="스튜디오 브랜드(선택)">
    <div style="height:8px"></div><button class="primary" onclick="createProject()">만들기</button>
  </div>
  <div class="card"><h2>프로젝트</h2><div id="plist" class="muted">없음</div></div>
</aside>
<section id="detail"><div class="card muted">왼쪽에서 프로젝트를 고르거나 새로 만드세요.</div></section>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);let cur=null,curPilot=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
try{$("#user").value=localStorage.getItem("s8user")||""}catch(e){}
$("#user").onchange=()=>{try{localStorage.setItem("s8user",$("#user").value)}catch(e){}};
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",6000)}
async function call(method,url,body,quiet){
  const r=await fetch(url,{method,headers:{"Content-Type":"application/json","X-Story8-User":$("#user").value||"anonymous"},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok){if(!quiet)toast(j.detail||("오류 "+r.status));throw new Error(j.detail)}return j}
async function busy(btn,fn){if(btn)btn.disabled=true;try{return await fn()}finally{if(btn)btn.disabled=false}}
async function health(){try{const h=await call("GET","/api/health");$("#health").textContent=h.provider==="hermes"?`Hermes · ${h.model} · ${h.reachable?"연결됨":"연결 안 됨"}`:"오프라인 생성기(시험용)"}catch(e){$("#health").textContent="서버 오류"}}
async function loadProjects(){const ps=await call("GET","/api/projects");
  $("#plist").innerHTML=ps.length?ps.map(p=>`<div class="proj ${cur===p.id?"on":""}" onclick="openProject('${p.id}')">${esc(p.name)} <span class="pill ${p.mode}">${p.mode==="auto"?"자동":"협업"}</span>${p.promoted_from?' <span class="pill">승격</span>':""}</div>`).join(""):"없음"}
async function createProject(){if(!$("#pname").value)return toast("이름을 입력하세요");
  const p=await call("POST","/api/projects",{name:$("#pname").value,mode:$("#pmode").value,brand:$("#pbrand").value||null});
  $("#pname").value="";await loadProjects();openProject(p.id)}
async function openProject(id){cur=id;const d=await call("GET",`/api/projects/${id}`);let bible=null;
  try{bible=await call("GET",`/api/projects/${id}/bible`,undefined,true)}catch(e){}
  loadProjects();render(d,bible)}
function render(d,bible){const p=d.project,pol=d.policy;
  const toggles=pol.toggles.map(t=>`<div class="tog"><span>${esc(t.title)}</span>${t.choices?`<select style="width:90px" onchange="setT('${t.key}',this.value)">${t.choices.map(c=>`<option ${c===t.value?"selected":""}>${c}</option>`).join("")}</select>`:`<input type="checkbox" style="width:auto" ${t.value?"checked":""} onchange="setT('${t.key}',this.checked)">`}</div>`).join("");
  const locked=pol.locked.map(r=>`<div class="tog lock"><span>🔒 ${esc(r.title)}</span><span class="muted">${esc(r.basis)}</span></div>`).join("");
  const pilots=d.pilots.map(x=>`<tr onclick="showPilot('${x.id}')" style="cursor:pointer"><td>${esc(x.hook_variant)}</td><td>${x.stage}</td><td>${x.pending_review?`<b>${x.pending_review} 승인 대기</b>`:"-"}</td><td>${x.status}</td><td>${x.rating||"-"}</td><td>${x.ai_tell?x.ai_tell.score:"-"}</td></tr>`).join("");
  $("#detail").innerHTML=`
  <div class="card"><div class="row"><h2 style="margin:0">${esc(p.name)} <span class="pill ${p.mode}">${p.mode==="auto"?"자동 모드":"협업 모드"}</span></h2>
   <button onclick="proof()">기여 증명서</button><button onclick="ledger()">원장 검증</button></div>
   <div class="muted">${p.promoted_from?"자동 모드에서 승격된 프로젝트입니다. 승격 이전 작업은 인간 기여로 소급 인정되지 않습니다.":""}</div></div>
  <div class="grid2">
  <div class="card"><h2>바이블 ${p.bible_approved?'<span class="pill">확정</span>':bible?'<span class="pill" style="color:var(--warn)">승인 대기</span>':""}</h2>
    ${bible?`<div class="muted">${esc(bible.title)} · ${esc(bible.genre)} · ${bible.story_year}년 · 인물 ${bible.characters.length}명</div><div>${esc(bible.logline)}</div>`:'<div class="muted">아직 없습니다.</div>'}
    <h3>AI로 생성</h3><div class="row"><input id="logline" placeholder="로그라인"><input id="genre" placeholder="장르" style="max-width:120px"><button onclick="genBible(this)">생성</button></div>
    <h3>직접 작성(JSON)</h3><textarea id="bjson">${bible?esc(JSON.stringify(bible,null,2)):""}</textarea>
    <div class="row" style="margin-top:6px"><button onclick="putBible(this)">작가 바이블로 저장</button>${bible&&!p.bible_approved?'<button class="primary" onclick="approveBible(this)">수정 반영 후 승인</button>':""}</div></div>
  <div class="card"><h2>정책·기능 설정</h2><div class="muted">법적 의무(🔒)는 끌 수 없고, 나머지는 자유롭게 켜고 끕니다.</div>${locked}${toggles}</div>
  </div>
  <div class="card"><h2>파일럿</h2><div class="row"><input id="hook" placeholder="훅 방향(예: 복수 선언 훅)"><input id="eps" value="1,2,3" style="max-width:100px"><button class="primary" onclick="newPilot(this)">파일럿 생성·실행</button></div>
   <table style="margin-top:10px"><tr><th>훅</th><th>단계</th><th>승인</th><th>상태</th><th>추정 등급</th><th>AI 티</th></tr>${pilots}</table></div>
  <div id="pilotview"></div>
  <div class="card"><h2>검증·승격</h2><div class="muted">독자단 평가와 A/B 결과(JSON 목록)를 넣으면 상위 25%를 승격 후보로 표시합니다.</div>
   <div class="grid2"><textarea id="ratings" placeholder='[{"rater":"r1","pilot_id":"plt_..","completion_intent":4,"rewatch":3,"recommend":4}]'></textarea>
   <textarea id="abres" placeholder='[{"pilot_id":"plt_..","impressions":1000,"completions":180}]'></textarea></div>
   <div class="row" style="margin-top:6px"><button onclick="addEval(this)">기록</button><button onclick="evaluate()">순위 보기</button></div><div id="board"></div></div>`;
  if(curPilot&&d.pilots.find(x=>x.id===curPilot))showPilot(curPilot)}
async function setT(k,v){const r=await call("PUT",`/api/projects/${cur}/settings`,{key:k,value:v});if(r.notice)toast("안내: "+r.notice);openProject(cur)}
async function genBible(b){await busy(b,()=>call("POST",`/api/projects/${cur}/bible/generate`,{logline:$("#logline").value,genre:$("#genre").value||"로맨스"}));openProject(cur)}
async function putBible(b){let j;try{j=JSON.parse($("#bjson").value)}catch(e){return toast("JSON 형식 오류")}await busy(b,()=>call("PUT",`/api/projects/${cur}/bible`,j));openProject(cur)}
async function approveBible(b){let j=null;try{j=JSON.parse($("#bjson").value)}catch(e){}await busy(b,()=>call("POST",`/api/projects/${cur}/bible/approve`,{edited:j}));openProject(cur)}
async function newPilot(b){const p=await busy(b,async()=>{const p=await call("POST",`/api/projects/${cur}/pilots`,{hook_variant:$("#hook").value||"기본 훅",episodes:$("#eps").value.split(",").map(Number)});return call("POST",`/api/projects/${cur}/pilots/${p.id}/run`)});curPilot=p.id;openProject(cur)}
function stageData(p){const s=p.pending_review;if(s==="beats")return p.beats;if(s==="script")return p.scenes;if(s==="storyboard")return p.storyboard;return null}
async function showPilot(id){curPilot=id;const p=await call("GET",`/api/projects/${cur}/pilots/${id}`);
  const script=p.scenes.map(s=>`[${s.episode}화] ${s.heading}\n${s.action}\n`+s.dialogue.map(d=>`  ${d.speaker}: ${d.line}`).join("\n")).join("\n\n");
  const beats=p.beats?p.beats.beats.map(b=>`${b.episode}화. ${b.summary}\n   ▶ ${b.hook||""}`).join("\n"):"";
  const issues=p.issues.map(i=>`<div class="issue ${i.severity}">[${i.severity}] ${esc(i.message)}</div>`).join("")||'<div class="muted">문제 없음</div>';
  const est=p.render_plan&&p.render_plan.estimate_usd;
  $("#pilotview").innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">파일럿 ${p.id} · ${esc(p.hook_variant)}</h2>
   ${p.stage==="done"?`<button onclick="exp('platform')">플랫폼용 내보내기</button><button onclick="exp('delivery')">납품용 내보내기</button><button onclick="promote()">협업으로 승격</button>`:`<button onclick="runP(this)">계속 실행</button>`}</div>
   ${p.pending_review?`<h3>${p.pending_review} 단계 사람 검토 — 그대로 승인하거나 고쳐서 승인하세요</h3><textarea id="edit">${esc(JSON.stringify(stageData(p),null,2))}</textarea>
   <div class="row" style="margin-top:6px"><input id="note" placeholder="메모(선택)"><button onclick="approve(this,false)">그대로 승인</button><button class="primary" onclick="approve(this,true)">수정 반영 후 승인</button></div>`:""}
   <div class="grid2"><div><h3>비트</h3><div class="script">${esc(beats)}</div><h3>대본</h3><div class="script">${esc(script)}</div></div>
   <div><h3>검수</h3>${issues}<h3>AI 티 ${p.ai_tell?p.ai_tell.score+" ("+p.ai_tell.level+")":"(꺼짐)"}</h3>${p.ai_tell?p.ai_tell.flags.map(f=>`<div class="muted">· ${esc(f)}</div>`).join(""):""}
   <h3>렌더 계획</h3>${est?`<div>샷 ${p.render_plan.shots.length}개 · ${p.render_plan.total_seconds}초 · 생성비 추정 $${est.generation}</div><div class="muted">${esc(est.note)}</div>`:'<div class="muted">스토리보드 단계 후 생성</div>'}</div></div></div>`}
async function runP(b){await busy(b,()=>call("POST",`/api/projects/${cur}/pilots/${curPilot}/run`));openProject(cur)}
async function approve(b,withEdit){let edited=null;if(withEdit){try{edited=JSON.parse($("#edit").value)}catch(e){return toast("JSON 형식 오류")}}
  await busy(b,()=>call("POST",`/api/projects/${cur}/pilots/${curPilot}/approve`,{edited,note:$("#note").value||null}));openProject(cur)}
async function exp(kind){const r=await call("POST",`/api/projects/${cur}/pilots/${curPilot}/export`,{kind});toast(`내보냄: ${r.path}\n${r.warnings.length?"경고:\n- "+r.warnings.join("\n- "):"경고 없음"}`)}
async function promote(){const r=await call("POST",`/api/projects/${cur}/pilots/${curPilot}/promote`);curPilot=null;toast("협업 프로젝트로 승격했습니다.");openProject(r.id)}
async function addEval(b){await busy(b,async()=>{if($("#ratings").value.trim())await call("POST",`/api/projects/${cur}/ratings`,JSON.parse($("#ratings").value));if($("#abres").value.trim())await call("POST",`/api/projects/${cur}/ab`,JSON.parse($("#abres").value))});toast("기록했습니다.")}
async function evaluate(){const rows=await call("GET",`/api/projects/${cur}/evaluation`);
  $("#board").innerHTML=`<table><tr><th>순위</th><th>파일럿</th><th>독자단</th><th>완주율</th><th>완주율 하한(95%)</th><th>점수</th><th>승격</th></tr>${rows.map(r=>`<tr><td>${r.rank??"-"}</td><td>${r.pilot_id}</td><td>${r.panel_score??"-"}</td><td>${r.completion_rate??"-"}</td><td>${r.completion_lb95??"-"}</td><td>${r.score??"-"}</td><td>${r.promote?"✅":""}</td></tr>`).join("")}</table>`}
async function proof(){const c=await call("GET",`/api/projects/${cur}/proof`);toast(`등급 ${c.grade} (${c.grade_text})\n원장 ${c.ledger_events}건 · 무결성 ${c.ledger_verified?"정상":"이상"}`)}
async function ledger(){const l=await call("GET",`/api/projects/${cur}/ledger`);toast(`원장 ${l.events.length}건 · ${l.ok?"변조 없음":"이상: "+l.errors.join(", ")}`)}
health();loadProjects();
</script>
</body>
</html>
