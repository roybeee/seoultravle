[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "story8"
version = "0.1.0"
description = "STORY 8 SHORTS - AI 하이브리드 숏드라마 IP 제작 시스템 (캐논 바이블 · AI 작가실 · 연속성 검증 · 권리 원장 · 기여 증명)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "httpx>=0.27"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
story8 = "story8.cli:main"

[tool.setuptools.packages.find]
include = ["story8*"]

[tool.setuptools.package-data]
story8 = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
